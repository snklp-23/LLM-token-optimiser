version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: token-optimizer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - token-optimizer-network
    # After first start, run: docker exec token-optimizer-ollama ollama pull mistral

  backend:
    build: ./backend
    container_name: token-optimizer-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - ollama
    networks:
      - token-optimizer-network

  frontend:
    build: ./frontend
    container_name: token-optimizer-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - token-optimizer-network

networks:
  token-optimizer-network:
    driver: bridge

volumes:
  ollama-data:
